[workspace]
resolver = "2"
members = [
    "proxy-engine",
    "tls",
    "http",
    "rules",
    "storage",
    "curl",
    "har",
    "ipc",
    "diagnostics",
]

# Shared metadata inherited by every member crate, so the core has a single
# place to set its version and edition.
[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.70"
