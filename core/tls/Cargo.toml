[package]
name = "proxy-tls"
version.workspace = true
edition.workspace = true
# Raised above the workspace default because rcgen 0.14 requires 1.88 and
# rustls 0.23.44 requires 1.71. The alternative was pinning older releases of
# both to hold the workspace's 1.70; that was rejected because this crate is
# the project's TLS implementation and running behind on a TLS library to keep
# an MSRV number is the wrong trade.
rust-version = "1.88"
description = "ProxyLab TLS: root CA, dynamic leaf certificates, and TLS interception."

[dependencies]
# The TLS implementation on both sides of the interception: the server session
# with the client and the client session with the origin. The alternative was
# OpenSSL bindings, rejected because it needs a system OpenSSL to build
# against and its `verify` API makes accidentally accepting an unverified
# certificate a one-line mistake; rustls verifies by construction and has no
# way to turn verification off without writing a verifier by hand.
#
# `default-features = false` with `ring` replaces the default `aws-lc-rs`
# provider, so the crate has exactly one cryptography backend — rcgen uses
# `ring` too. `tls12` keeps TLS 1.2 alongside TLS 1.3; rustls implements
# nothing older, so SSLv3, TLS 1.0 and TLS 1.1 cannot be enabled at all.
rustls = { version = "0.23.44", default-features = false, features = [
    "ring",
    "std",
    "tls12",
    "logging",
] }

# `CertificateDer`, `PrivateKeyDer` and `ServerName`: the types rustls and
# rcgen both speak, and the one place a host name is validated as something
# that can go in SNI and in a certificate. It is already in the tree as a
# dependency of both, and using it directly is what keeps `Host` from being a
# second, weaker host-name validator.
rustls-pki-types = { version = "1", features = ["std"] }

# The async handshake and stream wrappers over rustls, so this crate can own
# the handshakes and hand the engine a ready stream. Hand-rolling the
# `AsyncRead`/`AsyncWrite` plumbing around `rustls::Connection` was the
# alternative; it is a lot of state machine to get wrong for no gain. This is
# the rustls project's own version.
tokio-rustls = { version = "0.26", default-features = false, features = [
    "ring",
    "tls12",
    "logging",
] }

# The `AsyncRead`/`AsyncWrite` traits the handshakes are generic over, so this
# crate can wrap any stream the engine hands it — a socket, or the upgraded
# client connection a `CONNECT` produces. No features are enabled: only the
# traits are used, and tokio-rustls already brings the crate in.
tokio = { version = "1", default-features = false }

# X.509 generation: the root CA certificate and the leaf certificate minted
# for each intercepted host. There is no certificate generation in rustls or
# the standard library, and writing a DER/ASN.1 encoder for X.509 by hand is
# exactly the kind of thing that produces certificates clients quietly refuse.
# `x509-parser` is enabled so a CA persisted on an earlier run can be loaded
# back into an issuer from its own certificate, rather than being rebuilt from
# constants that a later version of this crate might have changed.
rcgen = { version = "0.14.10", default-features = false, features = [
    "crypto",
    "pem",
    "ring",
    "x509-parser",
] }

# The public web PKI trust anchors used to verify the real origin server's
# certificate. The alternative was `rustls-native-certs`, which reads the
# macOS keychain; it was rejected for now because it ties the core to a
# platform and the CA location for this step is deliberately platform-neutral.
webpki-roots = "1"

# Certificate validity periods. rcgen's `not_before`/`not_after` are
# `time::OffsetDateTime`, so this is rcgen's own public API rather than a
# second date library — it is already in the tree.
time = { version = "0.3", default-features = false, features = ["std"] }

[dev-dependencies]
# Reading the X.509 the crate produced back out, so the tests can assert on
# the certificate itself — basic constraints, key usage, SAN entries — rather
# than on the parameters that went in. Already compiled as part of rcgen's
# `x509-parser` feature, so it adds nothing to the build.
x509-parser = { version = "0.18", features = ["verify"] }

# The in-process TLS clients and servers the handshake tests are built from,
# plus timeouts so a handshake that never completes fails the suite instead of
# hanging it.
tokio = { version = "1", features = [
    "io-util",
    "macros",
    "net",
    "rt-multi-thread",
    "time",
] }
