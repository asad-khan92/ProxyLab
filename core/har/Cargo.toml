[package]
name = "proxy-har"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "ProxyLab HAR: captured traffic written as HAR 1.2, and a HAR file read back as captured traffic."

[dependencies]
# The captured exchange a HAR entry is written from and read back into. A HAR
# entry *is* an exchange in another spelling, so there is no traffic model in
# this crate: what is exported is what was captured, and what is imported is
# the same structure the traffic list already draws. Not a new third-party
# dependency — it is this workspace's own crate.
proxy-storage = { path = "../storage" }

# The HAR document's schema. HAR is JSON, the model is the Rust types, and
# serde is what keeps the two one thing rather than a writer and a reader that
# have to be kept in step. Not new to the build.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# A body that is not text is carried in HAR as base64 — `content.encoding`
# says so, and the specification names that encoding. Writing a base64 codec
# by hand was the alternative and was rejected for the reason it always is:
# it is a wire format other tools read, and a subtly wrong one produces a file
# that opens as gibberish somewhere else. Already in the tree as
# `proxy-storage`'s own dependency.
base64 = "0.23"

[dev-dependencies]
# Exporting writes a file and importing reads one, so the tests need a
# directory of their own that goes away with the test. Already in the tree as
# `proxy-storage`'s test dependency.
tempfile = "3"
